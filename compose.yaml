version: "3.8"

services:
  backend:
    container_name: you_messeger
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/api
    ports:
      - "5000:5000" # Mapeia a porta 5000 do container para a porta 5000 da máquina local
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - database

  database:
    image: "postgres"
    container_name: bd_messeger
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
